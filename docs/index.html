<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Radar — Wire</title>
<link rel="manifest" href="manifest.json" />
<meta name="color-scheme" content="only light" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="masthead">
  <p class="eyebrow">EST. TODAY &middot; UNATTENDED WIRE OPERATOR</p>
  <h1>JOB RADAR</h1>
  <div class="rule rule-thick"></div>
  <div class="rule rule-thin"></div>
  <p class="status-line">
    <span class="morse"></span>
    MONITORING TG CHANNELS &mdash; LIVE
  </p>
</header>

<main>
  <section class="controls">
    <input id="search" type="text" placeholder="wire a search e.g. 'accounting', 'remote', 'sales'" autocomplete="off" />
    <button id="notify-btn">Subscribe to wire</button>
  </section>

  <p id="status" class="status"></p>

  <ol id="feed" class="feed"></ol>
</main>

<footer>
  <div class="rule rule-thin"></div>
  <p>Job Radar. An unattended operator, listening so you don't have to.</p>
  <p>FrostCreated</p>
</footer>

<script src="app.js"></script>
</body>
</html>
